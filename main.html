<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="styles.css">
	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

	<!-- Button trigger modal -->
	<button type="button" class="btn btn-primary" id="launch-modal-btn" data-bs-toggle="modal" data-bs-target="#newton-Modal">
		launch newton modal
	</button>

	<!-- Modal -->
	<div class="modal fade" id="newton-Modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h1 class="modal-title fs-5" id="exampleModalLabel">New Modal</h1>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					Lorem ipsum, dolor sit amet consectetur adipisicing elit. Vero magni atque enim nisi modi cupiditate consequatur debitis ratione, voluptatem repellendus ab impedit architecto quaerat libero corporis rem, incidunt tempora iusto.
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
				</div>
			</div>
		</div>
	</div>
	
	<!-- Bootstrap JS Bundle with Popper -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<!-- Your custom script -->
	<script type="text/javascript" src="./script.js"></script>
</body>
</html>
